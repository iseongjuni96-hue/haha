<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니메이션</title>
    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: lightsalmon;
            border-radius: 50%;
            text-align: center;
            font-size: 30px;
            line-height: 200px;
            margin: 50px auto;  
            animation: anime 1s infinite alternate ease-in-out;
        }
        @keyframes anime {
            from {
                transform: translate(0,0);
            }to{
                transform: translate(400px,300px);
            }
        }
    </style>
</head>
<body>
    <div class="box"> animation</div>
</body>
</html>
