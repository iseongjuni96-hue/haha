<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클릭 이벤트</title>
    <style>
        #result {
            border: 1px solid lightgray;
            width: 200px;
            height: 200px;
            border-radius: 20px;
            position: relative;
            left: 80px;
            
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#" onclick="changeBg('green')">Green</a></li>
        <li><a href="#" onclick="changeBg('lightblue')">Lightblue</a></li>
        <li><a href="#" onclick="changeBg('darkgray')">darkgray
            
        </a></li>
    </ul>

    <div id="result"></div>

    <script>
        function changeBg(color) {
            let result = document.querySelector('#result');
            result.style.backgroundColor = color;
        }
    </script>
</body>
</html>
