<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아이디 찾기</title>
</head>
<body>
    <h2>아이디 찾기</h2>

    <!-- input의 id가 "name"과 "birthdate"로 지정되어 있어야 합니다 -->
    <label>이름</label>
    <input type="text" id="name" placeholder="이름 입력">

    <label>생년월일</label>
    <input type="text" id="birthdate" placeholder="예: 20000101">

    <!-- 버튼 클릭 시 findId() 함수 실행 -->
    <button onclick="findId()">아이디 찾기</button>

    <!-- 아래 <script> 태그 안에 추가합니다! -->
    <script>
        function findId() {
            const nameInput = document.getElementById("name").value.trim();
            const birthdateInput = document.getElementById("birthdate").value.trim();

            if (!nameInput || !birthdateInput) {
                alert("이름과 생년월일을 모두 입력해 주세요.");
                return;
            }

            const requestData = {
                name: nameInput,
                birthdate: birthdateInput
            };

            fetch("/api/auth/find-id", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestData)
            })
            .then(async (response) => {
                const message = await response.text();
                
                if (response.ok) {
                    alert(message); 
                } else {
                    alert(message); 
                }
            })
            .catch((error) => {
                console.error("통신 에러:", error);
                alert("서버 통신 중 오류가 발생했습니다.");
            });
        }
    </script>
</body>
</html>
