<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .login-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }

        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }

        .btn-login {
            width: 100%; padding: 10px; background-color: #007bff; color: white;
            border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 15px;
        }
        .btn-login:hover { background-color: #0056b3; }

        .bottom-links { display: flex; justify-content: space-around; font-size: 13px; }
        .bottom-links a { color: #666; text-decoration: none; cursor: pointer; }
        .bottom-links a:hover { text-decoration: underline; color: #007bff; }

        /* 모달 팝업 스타일 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center;
        }
        .modal-content { background-color: white; padding: 20px; border-radius: 8px; width: 280px; text-align: center; }
        .modal-content input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { flex: 1; padding: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>로그인</h2>
    
    <div class="input-group">
        <input type="text" id="login-id" placeholder="아이디" required>
    </div>
    <div class="input-group">
        <input type="password" id="login-pw" placeholder="비밀번호" required>
    </div>

    <button class="btn-login" onclick="handleLogin()">로그인</button>

    <div class="bottom-links">
        <a href="/board/signup.html">회원가입</a>
        <span>|</span>
        <a onclick="openModal('idModal')">아이디 찾기</a>
        <span>|</span>
        <a onclick="openModal('pwModal')">비밀번호 찾기</a>
    </div>
</div>

<!-- 아이디 찾기 모달 -->
<div id="idModal" class="modal">
    <div class="modal-content">
        <h3>아이디 찾기</h3>
        <input type="text" id="find-id-name" placeholder="이름">
        <input type="text" id="find-id-birth" placeholder="생년월일 6자리 (예: 080306)" maxlength="6">
        <div class="modal-buttons">
            <button onclick="handleFindId()">찾기</button>
            <button onclick="closeModal('idModal')">취소</button>
        </div>
    </div>
</div>

<!-- 비밀번호 찾기 모달 -->
<div id="pwModal" class="modal">
    <div class="modal-content">
        <h3>비밀번호 찾기</h3>
        <input type="text" id="find-pw-id" placeholder="아이디">
        <input type="text" id="find-pw-name" placeholder="이름">
        <input type="text" id="find-pw-birth" placeholder="생년월일 6자리 (예: 080306)" maxlength="6">
        <div class="modal-buttons">
            <button onclick="handleFindPw()">찾기</button>
            <button onclick="closeModal('pwModal')">취소</button>
        </div>
    </div>
</div>

<script>
function handleLogin() {
    const userid = document.getElementById("login-id").value;
    const password = document.getElementById("login-pw").value;

    if(!userid || !password) {
        alert("아이디와 비밀번호를 입력해주세요.");
        return;
    }

    fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userid, password })
    })
    .then(async res => {
        if (res.ok) {
            const data = await res.json();
            
            // 회원 정보 저장
            localStorage.setItem("user", JSON.stringify(data));
            
            alert((data.name || data.userid) + "님 환영합니다!");
            
            // 메인 페이지(index.html)로 이동
            location.href = "/"; 
        } else {
            const errorMsg = await res.text();
            alert(errorMsg);
        }
    })
    .catch(err => {
        console.error("에러 발생:", err);
        alert("로그인 처리 중 오류가 발생했습니다.");
    });
}

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function handleFindId() {
    const name = document.getElementById("find-id-name").value;
    const birthdate = document.getElementById("find-id-birth").value;

    fetch("/api/auth/find-id", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, birthdate })
    })
    .then(async res => {
        alert(await res.text());
        if(res.ok) closeModal('idModal');
    });
}

function handleFindPw() {
    const userid = document.getElementById("find-pw-id").value;
    const name = document.getElementById("find-pw-name").value;
    const birthdate = document.getElementById("find-pw-birth").value;

    fetch("/api/auth/find-pw", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userid, name, birthdate })
    })
    .then(async res => {
        alert(await res.text());
        if(res.ok) closeModal('pwModal');
    });
}
</script>

</body>
</html>
